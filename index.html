<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitte nicht drücken</title>

  <style>
    /* ---------- Farben & Schrift ---------- */
    :root {
      --bg:        #2a2c2e;   /* dunkelgrauer Hintergrund */
      --bg-deep:   #202224;   /* etwas dunkler für Verlauf/Rahmen */
      --text:      #ecebe6;   /* helles, leicht warmes Weiß */
      --muted:     #9a9d9f;
      --green:      #1fa84f;  /* Sekundärfarbe: knalliges Pflanzengrün */
      --green-light:#45d771;  /* Glanzlicht auf dem Knopf */
      --green-dark: #0f7a35;  /* Kante des Knopfes */
      --green-glow: rgba(31, 168, 79, 0.45);

      /* Weiche, runde Schrift – nutzt, was auf dem Gerät vorhanden ist */
      --font: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", "Varela Round",
              "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background:
        radial-gradient(ellipse at 50% 35%, #323537 0%, var(--bg) 55%, var(--bg-deep) 100%);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Layout ---------- */
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    /* Wenn die Bilder erscheinen, rutscht alles etwas nach oben */
    main.revealed { justify-content: flex-start; padding-top: 6vh; }

    h1 {
      margin: 0;
      max-width: 14ch;
      font-weight: 800;
      font-size: clamp(2.3rem, 7.5vw, 4.8rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-wrap: balance;
      transition: opacity .25s ease, transform .25s ease;
    }
    h1.swap { opacity: 0; transform: translateY(8px); }
    h1[hidden] { display: none; }

    /* ---------- Knopf ---------- */
    .button {
      appearance: none;
      border: 0;
      cursor: pointer;
      width: clamp(9rem, 28vw, 11rem);
      aspect-ratio: 1;
      border-radius: 50%;
      font: 800 1.25rem/1 var(--font);
      color: #04210e;
      background: radial-gradient(circle at 35% 30%, var(--green-light), var(--green) 62%);
      box-shadow:
        0 8px 0 var(--green-dark),
        0 18px 40px var(--green-glow);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .button:hover  { filter: brightness(1.06); }
    .button:active {
      transform: translateY(6px);
      box-shadow:
        0 2px 0 var(--green-dark),
        0 8px 24px var(--green-glow);
    }
    .button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 6px;
    }
    .button[hidden] { display: none; }

    /* ---------- Bilder ---------- */
    .gallery {
      width: min(1000px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .gallery[hidden] { display: none; }

    .gallery img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      border: 2px solid var(--green);
      background: var(--bg-deep);
      /* kleine Reaktion auf den Klick: die Bilder poppen nacheinander auf */
      animation: pop .45s cubic-bezier(.2, .9, .3, 1.3) both;
    }
    .gallery img:nth-child(2) { animation-delay: .12s; }
    .gallery img:nth-child(3) { animation-delay: .24s; }

    @keyframes pop {
      from { opacity: 0; transform: scale(.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .button, .gallery img { transition: none; animation: none; }
    }
  </style>
</head>

<body>
  <main id="seite">
    <h1 id="titel">Bitte nicht drücken</h1>

    <button class="button" id="knopf" type="button">Drücken</button>

    <!-- Hier erscheinen die Bilder (Pfade siehe Skript unten) -->
    <section class="gallery" id="galerie" aria-label="Bilder" hidden></section>
  </main>

  <script>
    // ---------- Einstellungen ----------
    // Trage hier deine eigenen Bilder ein (Ordner "bilder" neben der index.html).
    // Nur ein Bild gewünscht? Einfach die anderen Zeilen löschen.
    const BILDER = [
      { src: "bilder/bild1.jpg", alt: "Bild 1" },
      { src: "bilder/bild2.jpg", alt: "Bild 2" },
      { src: "bilder/bild3.jpg", alt: "Bild 3" }
    ];

    const TEXT_NACH_KLICK_1 = "Du willst ihn wirklich drücken, was?";

    // ---------- Logik ----------
    const seite   = document.getElementById("seite");
    const titel   = document.getElementById("titel");
    const knopf   = document.getElementById("knopf");
    const galerie = document.getElementById("galerie");

    let klicks = 0;

    // Platzhalter (grünes Bild), falls eine Bilddatei noch nicht existiert
    function platzhalter(nr) {
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">` +
        `<rect width="100%" height="100%" fill="#0f7a35"/>` +
        `<text x="50%" y="50%" fill="#ecebe6" font-family="Arial,sans-serif" font-weight="bold" font-size="56" ` +
        `text-anchor="middle" dominant-baseline="middle">Bild ${nr}</text></svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function zeigeBilder() {
      BILDER.forEach((b, i) => {
        const img = document.createElement("img");
        img.alt = b.alt;
        img.src = b.src;
        img.onerror = () => { img.onerror = null; img.src = platzhalter(i + 1); };
        galerie.appendChild(img);
      });
      galerie.hidden = false;
      seite.classList.add("revealed");
    }

    knopf.addEventListener("click", () => {
      klicks++;

      if (klicks === 1) {
        // Text sanft austauschen
        titel.classList.add("swap");
        setTimeout(() => {
          titel.textContent = TEXT_NACH_KLICK_1;
          titel.classList.remove("swap");
        }, 250);
      }

      if (klicks === 2) {
        knopf.hidden = true;   // Knopf verschwindet, die Bilder erscheinen
        titel.classList.add("swap");   // Text blendet aus ...
        setTimeout(() => { titel.hidden = true; }, 250);   // ... und verschwindet ganz
        zeigeBilder();
      }
    });
  </script>
</body>
</html>
